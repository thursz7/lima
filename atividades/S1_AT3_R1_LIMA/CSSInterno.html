<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS_Interno</title>
    <style>
        body {
            background-color: lightblue;
        }
        h1 {
            color: black;
            font-size: 48px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            text-align: center;
        }

        p {
            color: black;
            font-size: 18px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>CSS Interno</h1>
    <hr>
    <div>
        <p>CSS Interno é uma forma de aplicar estilos diretamente em elementos HTML usando a tag dentro do documento.
        </p>
    </div>
</body>

</html>
