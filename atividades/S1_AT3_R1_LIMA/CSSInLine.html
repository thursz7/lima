<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS_InLine</title>
</head>

<body>
    <!--   Declaração do CSS InLine   -->
    <h1
        style="color: rgb(130, 0, 0); font-size: 48px; background-color: rgb(31, 216, 249); font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif; text-align: center;">
        CSS In Line</h1>
    <p id="paragrafo1" style="color: rgb(0, 0, 0); font-size: 18px; background-color: rgb(255, 255, 255); font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif; text-align: center;">
        CSS In Line é uma forma de aplicar estilos diretamente em elementos HTML usando o atributo "style".</p>
</body>

</html>
